name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: wellstudio
          POSTGRES_PASSWORD: wellstudio
          POSTGRES_DB: wellstudio_integration
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U wellstudio -d wellstudio_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wellstudio:wellstudio@127.0.0.1:5432/wellstudio_integration
      DIRECT_URL: postgresql://wellstudio:wellstudio@127.0.0.1:5432/wellstudio_integration
      INTEGRATION_DATABASE_URL: postgresql://wellstudio:wellstudio@127.0.0.1:5432/wellstudio_integration
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_AGENTATION_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      PAYMENTS_CHECKOUT_MODE: sandbox
      E2E_AUTH_SANDBOX: 'false'
      E2E_AUTH_SANDBOX_REGISTER: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Deploy migrations to fresh PostgreSQL
        run: pnpm db:migrate:deploy

      - name: Run PostgreSQL integration regressions
        run: pnpm exec vitest run --config vitest.integration.config.ts

      - name: Run foundation gate
        run: pnpm check:foundation

      - name: Run smoke E2E
        run: pnpm test:e2e:smoke

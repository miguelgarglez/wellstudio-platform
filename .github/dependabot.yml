version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: preview
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: preview
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope

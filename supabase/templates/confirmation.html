<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirma tu correo · WellStudio</title>
    <style>
      @media only screen and (max-width: 620px) {
        .email-shell { padding: 16px !important; }
        .email-card { border-radius: 20px !important; }
        .email-brand { padding: 22px 24px !important; }
        .email-content { padding: 28px 24px 32px !important; }
        .email-title { font-size: 30px !important; letter-spacing: -0.8px !important; }
        .email-button { display: block !important; text-align: center !important; }
      }
    </style>
  </head>
  <body style="margin: 0; background: #f1ede7; color: #181716; font-family: Arial, Helvetica, sans-serif;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0;">
      Un paso para activar tu cuenta de WellStudio.
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background: #f1ede7;">
      <tr>
        <td class="email-shell" align="center" style="padding: 40px 20px;">
          <table class="email-card" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px; overflow: hidden; border: 1px solid #ddd7cf; border-radius: 24px; background: #ffffff;">
            <tr>
              <td class="email-brand" style="padding: 26px 40px; background: #0f1012;">
                <p style="margin: 0; color: #b7cee7; font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;">WellStudio</p>
              </td>
            </tr>
            <tr>
              <td class="email-content" style="padding: 36px 40px 40px;">
                <h1 class="email-title" style="margin: 0; color: #181716; font-size: 34px; line-height: 1.15; letter-spacing: -1px; font-weight: 700;">Confirma tu correo</h1>
                <p style="margin: 18px 0 0; color: #7b766e; font-size: 16px; line-height: 1.65;">Pulsa el botón para activar tu cuenta y entrar en tu espacio.</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin: 28px 0;">
                  <tr>
                    <td>
                      <a class="email-button" href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/app&amp;email={{ .Email }}" style="display: inline-block; border-radius: 16px; background: #4f89c5; color: #ffffff; font-size: 16px; font-weight: 700; line-height: 1; padding: 16px 24px; text-decoration: none;">Confirmar y entrar</a>
                    </td>
                  </tr>
                </table>
                <div style="border-top: 1px solid #ddd7cf; padding-top: 20px;">
                  <p style="margin: 0; color: #7b766e; font-size: 13px; line-height: 1.6;">Este enlace es personal y caduca pronto. Si no has creado esta cuenta, ignora este correo.</p>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
